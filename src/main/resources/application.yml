spring:
  application:
    name: deskflow
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:app_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mysql_local_dev}
  sql:
    init:
      mode: always
      encoding: UTF-8
server:
  error:
    include-message: never
